<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    
    <meta name="description" content="Open dataset of video games including developers, publishers, pricing, PEGI ratings, and platform releases with Metacritic scores.">
    <meta name="keywords" content="video games, open data, dataset, csv, json, json schema, metacritic, pegi, gaming">
    <meta name="author" content="Anđelko Kućar">

    {% if title %}
    <title>{{ title }} - Video Games Dataset</title>
    {% else %}
    <title>Video Games Dataset - OTVRAC</title>
    {% endif %}

    <!-- Bootstrap 5 CSS -->
    <link 
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.9/dist/css/bootstrap.min.css"
        rel="stylesheet"
        integrity="sha384-yEPZ7jP9S0QKiUQ0m3jjsO4ProIW7wvR9gXkI7JOGa2XVsw53Yke2bsdkBbjmmiX"
        crossorigin="anonymous">
</head>
<body class="d-flex flex-column min-vh-100 bg-light">
    <!-- Navigation bar -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container">
            <a class="navbar-brand" href="{{ url_for('index') }}">Video Games Dataset</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item">
                        <a class="nav-link" href="{{ url_for('index') }}">Home</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="{{ url_for('datatable') }}">Datatable</a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <!-- Main page content -->
    <main class="container my-4 flex-grow-1">
        {% block content %}
            <!-- Content -->
        {% endblock %}
    </main>

    <!-- Bootstrap 5 JavaScript -->
    <script 
        src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.9/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-WyOxWvTyr1QaMPfiPJSv76iReVthorl5uWlFtZPyK0IEB0hGzo9y5Bp9mYanr8Bu"
        crossorigin="anonymous">
    </script>
    
    <!-- Page Custom Javascript -->
    {% block scripts %}{% endblock %}
</body>
</html>
